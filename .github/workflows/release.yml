name: release

# 版本标签触发五个平台的原生 AOT 验证与 exe、deb、dmg 安装包发布。
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, for example 0.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test IEditor.slnx -c Release

      - name: Verify T4 localization keys
        shell: pwsh
        run: ./scripts/sync_localization_keys.ps1 -Check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify self-contained prototype
        shell: pwsh
        run: |
          node scripts/prototype/build.cjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Prototype generation drifted.' }
          npm ci --prefix scripts/prototype/tests
          if ($LASTEXITCODE -ne 0) { throw 'Prototype tools restore failed.' }
          Push-Location scripts/prototype/tests
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium install failed.' }
          Pop-Location
          node scripts/prototype/tests/audit-prototype.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline prototype audit failed.' }

      - name: Verify application behavior and rendering
        run: dotnet run --project scripts/ui-verification/UiVerification.csproj -c Release -- artifacts/ui-managed

      - name: Compare measured prototype layout
        run: node scripts/prototype/tests/compare-layout.cjs artifacts/ui-managed artifacts/prototype-audit

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.3.0 or 0.3.0): $version"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $version"

      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev libfontconfig1 libx11-6 fonts-noto-cjk

      - name: Publish (NativeAOT with full reflection metadata)
        shell: pwsh
        run: ./scripts/publish.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION

      - name: Verify the actual native executable without opening a window
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $executable = if ($IsWindows) { 'IEditor.App.exe' } else { 'IEditor.App' }
          $verificationDirectory = Join-Path $PWD "artifacts/runtime-verification/$rid"
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path (Resolve-Path "artifacts/publish/$rid/IEditor.App") $executable))
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.ArgumentList.Add('--verify-runtime')
          $start.ArgumentList.Add($verificationDirectory)
          $process = [Diagnostics.Process]::Start($start)
          if (!$process.WaitForExit(60000)) { $process.Kill($true); throw 'Published runtime verification timed out.' }
          if ($process.ExitCode -ne 0) { throw "Published runtime verification failed: $($process.ExitCode)" }
          $result = Join-Path $verificationDirectory 'runtime-verification.txt'
          if (!(Test-Path -LiteralPath $result)) { throw 'Runtime verification did not produce its result.' }
          Get-Content -LiteralPath $result

      - name: Publish and run native UI verification
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $output = "artifacts/ui-native/$rid"
          dotnet publish scripts/ui-verification/UiVerification.csproj -c Release -r $rid --self-contained true -m:1 -p:Version=$env:APP_VERSION -p:PublishAot=true -p:PublishTrimmed=true -p:DebugType=portable -p:DebugSymbols=true -p:IlcGenerateCompleteTypeMetadata=true -p:IlcTrimMetadata=false -p:IlcSingleThreaded=true -o $output
          if ($LASTEXITCODE -ne 0) { throw 'Native UI verification publish failed.' }
          $executable = if ($IsWindows) { 'UiVerification.exe' } else { 'UiVerification' }
          & (Join-Path (Resolve-Path $output) $executable) "artifacts/ui-evidence/$rid"
          if ($LASTEXITCODE -ne 0) { throw 'Native UI verification failed.' }

      - name: Retain native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IEditor-ui-${{ matrix.rid }}
          path: artifacts/ui-evidence/${{ matrix.rid }}
          if-no-files-found: ignore

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: scripts/IEditor.iss
          options: >-
            /DAppVersion=${{ env.APP_VERSION }}
            /DSourceDir=${{ github.workspace }}\artifacts\publish\win-x64\IEditor.App
            /DOutputDir=${{ github.workspace }}\artifacts\release

      - name: Compute installer SHA-256 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installerName = "IEditor-v$env:APP_VERSION-win-x64-setup.exe"
          $installerPath = Join-Path "artifacts/release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Installer was not produced: $installerPath"
          }
          $sha = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $installerName" | Set-Content -LiteralPath "$installerPath.sha256" -Encoding ASCII

      - name: 打包 Linux deb 安装包
        if: runner.os == 'Linux'
        shell: pwsh
        run: pwsh scripts/package_linux_deb.ps1 -RuntimeIdentifier '${{ matrix.rid }}' -Version $env:APP_VERSION -Force

      - name: 打包 macOS dmg 安装镜像
        if: runner.os == 'macOS'
        shell: bash
        run: chmod +x scripts/package_macos_dmg.sh && ./scripts/package_macos_dmg.sh '${{ matrix.rid }}' "$APP_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IEditor-installer-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: IEditor-installer-*
          path: artifacts/release
          merge-multiple: true

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v', 'V')
            $tagName = "v$version"
          } else {
            # 使用推送的标签原名。
            $tagName = '${{ github.ref_name }}'
            $version = $tagName.TrimStart('v', 'V')
          }
          if ($version -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Tag must be a numeric version (for example v0.3.0 or 0.3.0): $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag_name=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          $curated = ".github/release-notes/v$env:VERSION.md"
          $bodyPath = "artifacts/release-body.md"
          New-Item -ItemType Directory -Path (Split-Path -Parent $bodyPath) -Force | Out-Null
          if (Test-Path -LiteralPath $curated -PathType Leaf) {
            Copy-Item -LiteralPath $curated -Destination $bodyPath -Force
            Write-Host "Using curated release notes: $curated"
          }
          else {
            git fetch --quiet --tags origin
            if ($LASTEXITCODE -ne 0) { throw 'Tag fetch failed.' }
            $tagMessage = git tag -l "$env:TAG_NAME" --format='%(contents)'
            if ([string]::IsNullOrWhiteSpace($tagMessage)) { throw 'Release notes are required.' }
            $tagMessage | Set-Content -LiteralPath $bodyPath -Encoding utf8
          }

      - name: 校验五平台安装包与 SHA-256
        shell: pwsh
        run: ./scripts/verify_release_installers.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: IEditor v${{ steps.version.outputs.version }}
          body_path: artifacts/release-body.md
          generate_release_notes: true
          files: |
            artifacts/release/*.exe
            artifacts/release/*.deb
            artifacts/release/*.dmg
            artifacts/release/*.sha256
