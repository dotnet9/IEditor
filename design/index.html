const pages={"photo":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>证件照处理 · IEditor 界面原型<\/title>\n<style>/* ============================================================\n   IEditor 界面原型 · 设计系统\n   原则：清爽留白 + 科技感点缀（蓝青渐变 / 玻璃顶栏 / 扫描动效）\n   ============================================================ */\n\n* { box-sizing: border-box; }\n\n:root {\n  /* 色彩令牌 */\n  --bg: #f4f7fc;\n  --surface: #ffffff;\n  --surface-2: #f7f9fd;\n  --border: #e6ebf4;\n  --border-strong: #d8e0ee;\n  --text-1: #0f172a;\n  --text-2: #5b6b84;\n  --text-3: #93a1b8;\n  --primary: #2e6bff;\n  --cyan: #00b8d9;\n  --grad: linear-gradient(135deg, #2e6bff 0%, #00b8d9 100%);\n  --success: #12b76a;\n  --warning: #f59e0b;\n  --danger: #ef4444;\n  --ring: rgba(46, 107, 255, .18);\n  --shadow-1: 0 1px 2px rgba(15, 23, 42, .05);\n  --shadow-2: 0 2px 6px rgba(15, 23, 42, .05), 0 12px 32px rgba(15, 23, 42, .07);\n  --shadow-primary: 0 6px 18px rgba(46, 107, 255, .30);\n  --r-sm: 8px;\n  --r-md: 12px;\n  --r-lg: 16px;\n  --r-xl: 20px;\n  --mono: \"Cascadia Code\", \"JetBrains Mono\", Consolas, monospace;\n}\n\nhtml, body { margin: 0; height: 100%; }\n\nbody {\n  font-family: -apple-system, \"Segoe UI\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", \"PingFang SC\", sans-serif;\n  font-size: 13px;\n  color: var(--text-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  overflow: hidden;\n}\n\n::selection { background: rgba(46, 107, 255, .18); }\n\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }\n\n.ic { width: 17px; height: 17px; flex: none; }\n\n/* ---------------- 应用外壳 ---------------- */\n\n/* ---------------- 桌面与窗口外观 ----------------\n   原型以“桌面壁纸 + 圆角自绘窗口”呈现真实桌面软件观感 */\n\nbody.desktop {\n  overflow: hidden;\n  background:\n    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),\n    radial-gradient(1100px 700px at 88% -8%, rgba(0, 184, 217, .22), transparent 62%),\n    radial-gradient(900px 640px at -6% 108%, rgba(46, 107, 255, .24), transparent 62%),\n    linear-gradient(160deg, #0a1226 0%, #0e1c3d 52%, #072033 100%);\n  background-size: 42px 42px, 42px 42px, auto, auto, auto;\n}\n\n.desk { height: 100vh; padding: 26px 30px; display: flex; }\n\n.window {\n  flex: 1; min-width: 0;\n  display: flex; flex-direction: column;\n  position: relative;\n  border-radius: 14px; overflow: hidden;\n  background: var(--bg);\n  border: 1px solid rgba(140, 165, 210, .30);\n  box-shadow:\n    0 40px 90px rgba(4, 12, 32, .55),\n    0 12px 32px rgba(4, 12, 32, .38),\n    0 0 0 1px rgba(255, 255, 255, .06);\n}\n\n/* 导出对话框 */\n.overlay {\n  position: absolute; inset: 0; z-index: 300;\n  background: rgba(10, 22, 40, .45);\n  display: none; align-items: center; justify-content: center;\n}\n.dialog {\n  width: 440px; max-width: calc(100% - 48px);\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 14px; box-shadow: var(--shadow-2);\n}\n.dialog-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-size: 14px;\n}\n.dialog-h b { font-size: 14px; }\n.dialog-h .ic { color: var(--primary); }\n.dialog-h .icon-btn { margin-left: auto; }\n.dialog-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }\n.dialog-actions .btn { min-width: 76px; }\n/* 窗口顶部品牌渐变线 */\n.window::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 3px;\n  background: var(--grad); z-index: 30;\n}\n\n/* 自定义标题栏 */\n.titlebar {\n  height: 42px; flex: none; position: relative; z-index: 10;\n  display: flex; align-items: center; gap: 10px; padding-left: 14px;\n  background: linear-gradient(180deg, #fcfdff, #f5f8fd);\n  border-bottom: 1px solid var(--border);\n  user-select: none;\n}\n.titlebar img { width: 34px; height: 34px; border-radius: 9px; display: block; }\n.titlebar .brand-text { line-height: 1.25; }\n.titlebar .brand-text b { display: block; font-size: 15px; letter-spacing: .2px; }\n.titlebar .brand-text small { font-size: 11px; color: var(--text-3); }\n.win-controls { margin-left: auto; align-self: stretch; display: flex; }\n\n/* 菜单栏：收纳低频命令（打开/导出/主题/更新等），保持工作区清爽 */\n.menubar {\n  height: 34px; flex: none; position: relative; z-index: 60;\n  display: flex; align-items: stretch; padding: 0 10px;\n  background: var(--surface); border-bottom: 1px solid var(--border);\n}\n.menu { position: relative; display: flex; }\n.menu-item {\n  display: flex; align-items: center; padding: 0 13px;\n  font-size: 12.5px; color: var(--text-2); cursor: default; user-select: none;\n}\n.menu:hover .menu-item { background: rgba(46, 107, 255, .08); color: var(--text-1); }\n.menu-dropdown {\n  display: none; position: absolute; top: 100%; left: 0; min-width: 236px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px; z-index: 100;\n}\n.menu:hover .menu-dropdown { display: block; }\n.menu-entry {\n  display: flex; align-items: center; gap: 8px;\n  padding: 7px 10px 7px 30px; border-radius: 8px;\n  font-size: 12.5px; color: var(--text-1); text-decoration: none;\n  cursor: pointer; position: relative; white-space: nowrap;\n}\n.menu-entry:hover { background: rgba(46, 107, 255, .08); }\n.menu-entry .check { position: absolute; left: 11px; font-size: 11px; color: var(--primary); }\n.menu-entry code { margin-left: auto; padding-left: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }\n.menu-entry.disabled { opacity: .45; cursor: not-allowed; }\n.menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }\n.menu-entry.has-sub::after { content: \"›\"; margin-left: auto; padding-left: 16px; color: var(--text-3); }\n.submenu {\n  display: none; position: absolute; left: 100%; top: -7px; min-width: 150px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px;\n}\n.menu-entry.has-sub:hover .submenu { display: block; }\n.menubar .hint { margin-left: auto; align-self: center; font-size: 11px; color: var(--text-3); }\n\n/* 舞台空态提示 */\n.stage-hint {\n  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);\n  background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px);\n  border: 1px solid var(--border); border-radius: 999px;\n  padding: 6px 14px; font-size: 11.5px; color: var(--text-2); white-space: nowrap;\n}\n.stage-hint b { color: var(--primary); font-weight: 600; }\n.wc {\n  width: 46px; border: none; background: none; cursor: pointer;\n  color: var(--text-2); display: flex; align-items: center; justify-content: center;\n}\n.wc svg { width: 11px; height: 11px; display: block; }\n.wc:hover { background: #e8eef8; color: var(--text-1); }\n.wc.close:hover { background: #e81123; color: #fff; }\n\n.win-body { flex: 1; min-height: 0; overflow: auto; }\n\n.app { display: flex; height: 100%; min-height: 0; }\n\n/* 主区 */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; gap: 12px; padding: 0 20px;\n  border-bottom: 1px solid var(--border);\n  background: rgba(255, 255, 255, .78);\n  backdrop-filter: blur(10px);\n  z-index: 5;\n}\n.crumb { color: var(--text-3); font-size: 13px; }\n.crumb b { color: var(--text-1); font-size: 14.5px; font-weight: 600; margin-left: 6px; }\n.spacer { flex: 1; }\n\n.icon-btn {\n  width: 32px; height: 32px; border-radius: 9px;\n  border: 1px solid transparent; background: transparent;\n  color: var(--text-2); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.icon-btn:hover { background: #eef3fb; color: var(--text-1); }\n\n.content {\n  flex: 1; overflow: auto; padding: 20px;\n  background-image: radial-gradient(circle, rgba(46, 107, 255, .07) 1px, transparent 1.4px);\n  background-size: 22px 22px;\n}\n\n.statusbar {\n  height: 34px; flex: none;\n  display: flex; align-items: center; gap: 16px; padding: 0 20px;\n  border-top: 1px solid var(--border);\n  color: var(--text-2); font-size: 12px; background: var(--surface);\n}\n.statusbar .meta { color: var(--text-3); }\n.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }\n.dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(18, 183, 106, .15); }\n.dot.busy { background: var(--primary); box-shadow: 0 0 0 3px rgba(46, 107, 255, .18); animation: pulse 1.2s infinite; }\n@keyframes pulse { 50% { opacity: .35; } }\n\n/* ---------------- 卡片 ---------------- */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-1);\n}\n.card-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-weight: 600; font-size: 13px;\n}\n.card-h .ic { color: var(--primary); }\n.card-h .hint { margin-left: auto; font-weight: 400; color: var(--text-3); font-size: 11px; }\n.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }\n.card-b:last-child { padding-top: 0; }\n\n/* ---------------- 按钮 ---------------- */\n\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n  height: 34px; padding: 0 14px;\n  border-radius: 10px; border: 1px solid var(--border-strong);\n  background: var(--surface); color: var(--text-1);\n  font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer;\n  transition: .15s; white-space: nowrap;\n}\n.btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 8px rgba(46, 107, 255, .12); }\n.btn.primary { background: var(--grad); border: none; col e=\"font-family:var(--mono)\">92<\/b><\/label>\n            <input id=\"qRange\" type=\"range\" min=\"60\" max=\"100\" value=\"92\">\n          <\/div>\n          <div class=\"field\">\n            <label>保存位置<\/label>\n            <div style=\"display:flex;gap:8px\">\n              <input class=\"input mono\" value=\"D:\\Pictures\\IEditor\" readonly>\n              <button class=\"btn\" style=\"height:34px\" type=\"button\">浏览<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"field\">\n            <label>文件名<\/label>\n            <input class=\"input mono\" value=\"photo_one-inch_blue.jpg\">\n          <\/div>\n          <div class=\"dialog-actions\">\n            <button class=\"btn\" data-close type=\"button\">取消<\/button>\n            <button class=\"btn primary\" type=\"button\">保存<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n<\/div>\n\n<script>/* IEditor 原型 · 通用交互（分段选择 / 色板 / 规格卡 / 滑杆着色） */\n(function () {\n  function activateIn(container, selector, cls) {\n    container.querySelectorAll(selector).forEach(function (el) {\n      el.classList.toggle(cls, el === container.__active);\n    });\n  }\n\n  document.addEventListener('click', function (e) {\n    // 分段选择\n    var segOpt = e.target.closest('.seg [data-value]');\n    if (segOpt && !segOpt.disabled) {\n      var seg = segOpt.closest('.seg');\n      seg.querySelectorAll('[data-value]').forEach(function (b) {\n        b.classList.toggle('on', b === segOpt);\n      });\n      seg.dispatchEvent(new CustomEvent('segchange', { bubbles: true, detail: { value: segOpt.dataset.value } }));\n    }\n\n    // 色板\n    var sw = e.target.closest('.swatch');\n    if (sw) {\n      var group = sw.closest('.swatches');\n      group.querySelectorAll('.swatch').forEach(function (s) { s.classList.toggle('on', s === sw); });\n      group.dispatchEvent(new CustomEvent('swchange', { bubbles: true, detail: { color: sw.dataset.color || null } }));\n    }\n\n    // 规格卡片\n    var spec = e.target.closest('.spec');\n    if (spec && !spec.disabled) {\n      var grid = spec.closest('.spec-grid');\n      grid.querySelectorAll('.spec').forEach(function (s) { s.classList.toggle('on', s === spec); });\n      document.dispatchEvent(new CustomEvent('specchange', { detail: { id: spec.dataset.spec } }));\n    }\n  });\n\n  // 滑杆轨道着色\n  function paintRange(r) {\n    var min = Number(r.min) || 0, max = Number(r.max) || 100;\n    var p = ((Number(r.value) - min) / (max - min)) * 100;\n    r.style.setProperty('--p', p + '%');\n  }\n  document.querySelectorAll('input[type=\"range\"]').forEach(function (r) {\n    paintRange(r);\n    r.addEventListener('input', function () { paintRange(r); });\n  });\n})();\n<\/script>\n<script>\n(function () {\n  var SPECS = { '1inch': [25, 35], '2inch': [35, 49], 'small2': [33, 48], custom: null };\n  var spec = '1inch';\n  var $ = function (id) { return document.getElementById(id); };\n  var wIn = $('wIn'), hIn = $('hIn'), dpiVal = $('dpiVal');\n\n  function px(mm, dpi) { return Math.round(mm / 25.4 * dpi); }\n\n  function update() {\n    var dpi = parseInt(dpiVal.textContent, 10);\n    var mm = spec === 'custom' ? [parseFloat(wIn.value) || 0, parseFloat(hIn.value) || 0] : SPECS[spec];\n    var pw = px(mm[0], dpi), ph = px(mm[1], dpi);\n    $('pxOut').textContent = pw + ' × ' + ph + ' px';\n    $('mmOut').textContent = mm[0] + ' × ' + mm[1] + ' mm';\n    $('dimChip').textContent = pw + ' × ' + ph + ' px · ' + dpi + ' DPI';\n    $('stSize').textContent = pw + '×' + ph + ' px @ ' + dpi + ' DPI';\n  }\n\n  document.addEventListener('specchange', function (e) {\n    spec = e.detail.id;\n    var custom = spec === 'custom';\n    $('wField').classList.toggle('disabled', !custom);\n    $('hField').classList.toggle('disabled', !custom);\n    if (!custom) { wIn.value = SPECS[spec][0]; hIn.value = SPECS[spec][1]; }\n    update();\n  });\n\n  document.querySelectorAll('[data-dpi]').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var v = parseInt(dpiVal.textContent, 10) + (btn.dataset.dpi === '+' ? 30 : -30);\n      dpiVal.textContent = Math.min(1200, Math.max(72, v));\n      update();\n    });\n  });\n\n  wIn.addEventListener('input', update);\n  hIn.addEventListener('input', update);\n\n  // 背景色联动\n  var photo = $('photo');\n  $('bgSwatches').addEventListener('swchange', function (e) {\n    var color = e.detail.color;\n    var swatch = e.target.querySelector('.swatch.on');\n    $('bgName').textContent = swatch ? (swatch.dataset.name || '自定义') : '自定义';\n    if (!color) color = '#7C5CFF'; // 自定义色板（原型演示值）\n    photo.style.background = color;\n    $('hexInput').value = color.replace('#', '').toUpperCase();\n    $('hexDot').style.background = color;\n  });\n  $('hexInput').addEventListener('input', function () {\n    var v = this.value.trim();\n    if (/^[0-9a-fA-F]{6}$/.test(v)) {\n      photo.style.background = '#' + v;\n      $('hexDot').style.background = '#' + v;\n      $('bgName').textContent = '自定义';\n    }\n  });\n\n  // 质量\n  $('qRange').addEventListener('input', function () {\n    $('qVal').textContent = this.value;\n    $('stFmt').textContent = 'JPG · 质量 ' + this.value + ' · 约 ' + Math.round(this.value * 0.94) + ' KB';\n  });\n\n  // 格式\n  $('fmtSeg').addEventListener('segchange', function (e) {\n    $('stFmt').textContent = e.detail.value.toUpperCase() + ' · 质量 ' + $('qVal').textContent + ' · 约 9' + Math.round(Math.random() * 8) + ' KB';\n  });\n\n  // 参考线\n  $('btnGuides').addEventListener('click', function () {\n    this.classList.toggle('on');\n    $('guides').classList.toggle('hidden');\n  });\n\n  // 原图对比（按住查看）\n  var compareBtn = $('btnCompare'), dimChip = $('dimChip'), savedDim = dimChip.textContent;\n  function compareOn() { compareBtn.classList.add('on'); photo.classList.add('compare'); dimChip.textContent = '原图 · 1200 × 1600'; }\n  function compareOff() { compareBtn.classList.remove('on'); photo.classList.remove('compare'); dimChip.textContent = savedDim; }\n  compareBtn.addEventListener('mousedown', compareOn);\n  compareBtn.addEventListener('mouseup', compareOff);\n  compareBtn.addEventListener('mouseleave', compareOff);\n\n  // 缩放\n  var zoomLevels = [50, 75, 100, 125, 150, 200], zi = 2;\n  function applyZoom() {\n    $('zoomPct').textContent = zoomLevels[zi] + '%';\n    photo.style.transform = 'scale(' + zoomLevels[zi] / 100 + ')';\n  }\n  document.querySelectorAll('[data-zoom]').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var z = btn.dataset.zoom;\n      if (z === '+') zi = Math.min(zoomLevels.length - 1, zi + 1);\n      else if (z === '-') zi = Math.max(0, zi - 1);\n      else zi = 2;\n      applyZoom();\n    });\n  });\n\n  update();\n})();\n<\/script>\n<script>\n  (function () {\n    var dlg = document.getElementById('exportDialog');\n    document.querySelectorAll('[data-export]').forEach(function (el) {\n      el.addEventListener('click', function (e) { e.preventDefault(); dlg.style.display = 'flex'; });\n    });\n    dlg.querySelectorAll('[data-close]').forEach(function (el) {\n      el.addEventListener('click', function () { dlg.style.display = 'none'; });\n    });\n  })();\n<\/script>\n<script>// 根据应用 JSON 生成；运行 scripts/sync_localization_keys.ps1 更新。\nwindow.IEDITOR_RESOURCES = {\"zh-CN\":{\"language\":\"简体中文\",\"description\":\"IEditor 简体中文资源\",\"cultureName\":\"zh-CN\",\"Localization\":{\"Common\":{\"Filenames\":{\"Default\":\"证件照\",\"Photo\":\"照片\",\"Unnamed\":\"未命名\",\"DefaultTemplate\":\"photo_{size}_{color}\",\"BatchTemplate\":\"photo_{name}_{size}\"},\"Menu\":{\"File\":\"文件\",\"Edit\":\"编辑\",\"View\":\"视图\",\"Exit\":\"退出\",\"OpenImage\":\"打开图片…\",\"About\":\"关于 IEditor\",\"ZoomIn\":\"放大\",\"ZoomOut\":\"缩小\",\"FitWindow\":\"适应窗口\",\"Filename\":\"文件名\",\"StageHint\":\"拖入图片，或使用 文件 › 打开图片（Ctrl+O）\",\"AddImages\":\"添加图片…\",\"ExportImage\":\"导出图片…\",\"CheckUpdate\":\"检查更新…\",\"Workbench\":\"工作台 /\",\"ShowGuides\":\"显示参考线\",\"CompareOriginal\":\"原图对比（按住）\",\"Rep ible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }\n\n.ic { width: 17px; height: 17px; flex: none; }\n\n/* ---------------- 应用外壳 ---------------- */\n\n/* ---------------- 桌面与窗口外观 ----------------\n   原型以“桌面壁纸 + 圆角自绘窗口”呈现真实桌面软件观感 */\n\nbody.desktop {\n  overflow: hidden;\n  background:\n    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),\n    radial-gradient(1100px 700px at 88% -8%, rgba(0, 184, 217, .22), transparent 62%),\n    radial-gradient(900px 640px at -6% 108%, rgba(46, 107, 255, .24), transparent 62%),\n    linear-gradient(160deg, #0a1226 0%, #0e1c3d 52%, #072033 100%);\n  background-size: 42px 42px, 42px 42px, auto, auto, auto;\n}\n\n.desk { height: 100vh; padding: 26px 30px; display: flex; }\n\n.window {\n  flex: 1; min-width: 0;\n  display: flex; flex-direction: column;\n  position: relative;\n  border-radius: 14px; overflow: hidden;\n  background: var(--bg);\n  border: 1px solid rgba(140, 165, 210, .30);\n  box-shadow:\n    0 40px 90px rgba(4, 12, 32, .55),\n    0 12px 32px rgba(4, 12, 32, .38),\n    0 0 0 1px rgba(255, 255, 255, .06);\n}\n\n/* 导出对话框 */\n.overlay {\n  position: absolute; inset: 0; z-index: 300;\n  background: rgba(10, 22, 40, .45);\n  display: none; align-items: center; justify-content: center;\n}\n.dialog {\n  width: 440px; max-width: calc(100% - 48px);\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 14px; box-shadow: var(--shadow-2);\n}\n.dialog-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-size: 14px;\n}\n.dialog-h b { font-size: 14px; }\n.dialog-h .ic { color: var(--primary); }\n.dialog-h .icon-btn { margin-left: auto; }\n.dialog-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }\n.dialog-actions .btn { min-width: 76px; }\n/* 窗口顶部品牌渐变线 */\n.window::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 3px;\n  background: var(--grad); z-index: 30;\n}\n\n/* 自定义标题栏 */\n.titlebar {\n  height: 42px; flex: none; position: relative; z-index: 10;\n  display: flex; align-items: center; gap: 10px; padding-left: 14px;\n  background: linear-gradient(180deg, #fcfdff, #f5f8fd);\n  border-bottom: 1px solid var(--border);\n  user-select: none;\n}\n.titlebar img { width: 34px; height: 34px; border-radius: 9px; display: block; }\n.titlebar .brand-text { line-height: 1.25; }\n.titlebar .brand-text b { display: block; font-size: 15px; letter-spacing: .2px; }\n.titlebar .brand-text small { font-size: 11px; color: var(--text-3); }\n.win-controls { margin-left: auto; align-self: stretch; display: flex; }\n\n/* 菜单栏：收纳低频命令（打开/导出/主题/更新等），保持工作区清爽 */\n.menubar {\n  height: 34px; flex: none; position: relative; z-index: 60;\n  display: flex; align-items: stretch; padding: 0 10px;\n  background: var(--surface); border-bottom: 1px solid var(--border);\n}\n.menu { position: relative; display: flex; }\n.menu-item {\n  display: flex; align-items: center; padding: 0 13px;\n  font-size: 12.5px; color: var(--text-2); cursor: default; user-select: none;\n}\n.menu:hover .menu-item { background: rgba(46, 107, 255, .08); color: var(--text-1); }\n.menu-dropdown {\n  display: none; position: absolute; top: 100%; left: 0; min-width: 236px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px; z-index: 100;\n}\n.menu:hover .menu-dropdown { display: block; }\n.menu-entry {\n  display: flex; align-items: center; gap: 8px;\n  padding: 7px 10px 7px 30px; border-radius: 8px;\n  font-size: 12.5px; color: var(--text-1); text-decoration: none;\n  cursor: pointer; position: relative; white-space: nowrap;\n}\n.menu-entry:hover { background: rgba(46, 107, 255, .08); }\n.menu-entry .check { position: absolute; left: 11px; font-size: 11px; color: var(--primary); }\n.menu-entry code { margin-left: auto; padding-left: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }\n.menu-entry.disabled { opacity: .45; cursor: not-allowed; }\n.menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }\n.menu-entry.has-sub::after { content: \"›\"; margin-left: auto; padding-left: 16px; color: var(--text-3); }\n.submenu {\n  display: none; position: absolute; left: 100%; top: -7px; min-width: 150px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px;\n}\n.menu-entry.has-sub:hover .submenu { display: block; }\n.menubar .hint { margin-left: auto; align-self: center; font-size: 11px; color: var(--text-3); }\n\n/* 舞台空态提示 */\n.stage-hint {\n  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);\n  background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px);\n  border: 1px solid var(--border); border-radius: 999px;\n  padding: 6px 14px; font-size: 11.5px; color: var(--text-2); white-space: nowrap;\n}\n.stage-hint b { color: var(--primary); font-weight: 600; }\n.wc {\n  width: 46px; border: none; background: none; cursor: pointer;\n  color: var(--text-2); display: flex; align-items: center; justify-content: center;\n}\n.wc svg { width: 11px; height: 11px; display: block; }\n.wc:hover { background: #e8eef8; color: var(--text-1); }\n.wc.close:hover { background: #e81123; color: #fff; }\n\n.win-body { flex: 1; min-height: 0; overflow: auto; }\n\n.app { display: flex; height: 100%; min-height: 0; }\n\n/* 主区 */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; gap: 12px; padding: 0 20px;\n  border-bottom: 1px solid var(--border);\n  background: rgba(255, 255, 255, .78);\n  backdrop-filter: blur(10px);\n  z-index: 5;\n}\n.crumb { color: var(--text-3); font-size: 13px; }\n.crumb b { color: var(--text-1); font-size: 14.5px; font-weight: 600; margin-left: 6px; }\n.spacer { flex: 1; }\n\n.icon-btn {\n  width: 32px; height: 32px; border-radius: 9px;\n  border: 1px solid transparent; background: transparent;\n  color: var(--text-2); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.icon-btn:hover { background: #eef3fb; color: var(--text-1); }\n\n.content {\n  flex: 1; overflow: auto; padding: 20px;\n  background-image: radial-gradient(circle, rgba(46, 107, 255, .07) 1px, transparent 1.4px);\n  background-size: 22px 22px;\n}\n\n.statusbar {\n  height: 34px; flex: none;\n  display: flex; align-items: center; gap: 16px; padding: 0 20px;\n  border-top: 1px solid var(--border);\n  color: var(--text-2); font-size: 12px; background: var(--surface);\n}\n.statusbar .meta { color: var(--text-3); }\n.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }\n.dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(18, 183, 106, .15); }\n.dot.busy { background: var(--primary); box-shadow: 0 0 0 3px rgba(46, 107, 255, .18); animation: pulse 1.2s infinite; }\n@keyframes pulse { 50% { opacity: .35; } }\n\n/* ---------------- 卡片 ---------------- */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-1);\n}\n.card-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-weight: 600; font-size: 13px;\n}\n.card-h .ic { color: var(--primary); }\n.card-h .hint { margin-left: auto; font-weight: 400; color: var(--text-3); font-size: 11px; }\n.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }\n.card-b:last-child { padding-top: 0; }\n\n/* ---------------- 按钮 ---------------- */\n\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n  height: 34 e.setProperty('--grad',`linear-gradient(135deg,${token.StudioAccentColor},${token.StudioSecondaryColor})`);document.body.dataset.theme=dark?'dark':'light';document.documentElement.lang=state.language;\n    for(const item of nodes)item.node.textContent=item.before+t(item.resource)+item.after;for(const item of attrs)item.el.setAttribute(item.attribute,t(item.resource));document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(key(el.dataset.i18n)));\n    const modeButton=tools.querySelector('[data-theme-cycle]');modeButton.textContent=({System:'▣',Light:'☀',Dark:'☾'})[state.mode];modeButton.dataset.mode=state.mode;modeButton.title=t(key('Settings.Labels.Theme'))+': '+t(key('Common.Theme.'+state.mode));modeButton.setAttribute('aria-label',modeButton.title);\n    const captionLabels=state.language==='zh-CN'?['最小化','最大化或还原','关闭']:['Minimize','Maximize or restore','Close'];captionButtons.forEach((button,index)=>{button.title=captionLabels[index];button.setAttribute('aria-label',button.title);});\n    languageButton.title=t(key('Settings.Labels.Language'));languageButton.setAttribute('aria-label',languageButton.title);tools.querySelectorAll('[data-culture]').forEach(button=>{button.textContent=t(key('Common.Language.'+(button.dataset.culture==='zh-CN'?'SimplifiedChinese':'English')));button.setAttribute('aria-checked',button.dataset.culture===state.language);});\n    document.querySelectorAll('[data-palette-key]').forEach(button=>{button.classList.toggle('on',button.dataset.paletteKey===state.palette);button.title=t(key('Settings.Options.'+button.dataset.paletteKey));});renderQuality();renderUpdate();}\n  register(document.body);render();\n  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());\n  window.IEditorPrototype={set,getState:()=>({...state}),openAbout:()=>about.showModal(),setUpdate:value=>{update=value;renderUpdate();}};\n})();\n<\/script>\n<script>document.addEventListener('click',event=>{const anchor=event.target.closest('a[href]');if(anchor&&['#photo','#batch','#settings'].includes(anchor.getAttribute('href'))){event.preventDefault();parent.postMessage({kind:'ieditor-route',route:anchor.getAttribute('href').slice(1)},'*');}});<\/script><\/body>\n<\/html>\n","settings":"<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>设置 · IEditor 界面原型<\/title>\n<style>/* ============================================================\n   IEditor 界面原型 · 设计系统\n   原则：清爽留白 + 科技感点缀（蓝青渐变 / 玻璃顶栏 / 扫描动效）\n   ============================================================ */\n\n* { box-sizing: border-box; }\n\n:root {\n  /* 色彩令牌 */\n  --bg: #f4f7fc;\n  --surface: #ffffff;\n  --surface-2: #f7f9fd;\n  --border: #e6ebf4;\n  --border-strong: #d8e0ee;\n  --text-1: #0f172a;\n  --text-2: #5b6b84;\n  --text-3: #93a1b8;\n  --primary: #2e6bff;\n  --cyan: #00b8d9;\n  --grad: linear-gradient(135deg, #2e6bff 0%, #00b8d9 100%);\n  --success: #12b76a;\n  --warning: #f59e0b;\n  --danger: #ef4444;\n  --ring: rgba(46, 107, 255, .18);\n  --shadow-1: 0 1px 2px rgba(15, 23, 42, .05);\n  --shadow-2: 0 2px 6px rgba(15, 23, 42, .05), 0 12px 32px rgba(15, 23, 42, .07);\n  --shadow-primary: 0 6px 18px rgba(46, 107, 255, .30);\n  --r-sm: 8px;\n  --r-md: 12px;\n  --r-lg: 16px;\n  --r-xl: 20px;\n  --mono: \"Cascadia Code\", \"JetBrains Mono\", Consolas, monospace;\n}\n\nhtml, body { margin: 0; height: 100%; }\n\nbody {\n  font-family: -apple-system, \"Segoe UI\", \"Microsoft YaHei UI\", \"Microsoft YaHei\", \"PingFang SC\", sans-serif;\n  font-size: 13px;\n  color: var(--text-1);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  overflow: hidden;\n}\n\n::selection { background: rgba(46, 107, 255, .18); }\n\n:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }\n\n.ic { width: 17px; height: 17px; flex: none; }\n\n/* ---------------- 应用外壳 ---------------- */\n\n/* ---------------- 桌面与窗口外观 ----------------\n   原型以“桌面壁纸 + 圆角自绘窗口”呈现真实桌面软件观感 */\n\nbody.desktop {\n  overflow: hidden;\n  background:\n    linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),\n    radial-gradient(1100px 700px at 88% -8%, rgba(0, 184, 217, .22), transparent 62%),\n    radial-gradient(900px 640px at -6% 108%, rgba(46, 107, 255, .24), transparent 62%),\n    linear-gradient(160deg, #0a1226 0%, #0e1c3d 52%, #072033 100%);\n  background-size: 42px 42px, 42px 42px, auto, auto, auto;\n}\n\n.desk { height: 100vh; padding: 26px 30px; display: flex; }\n\n.window {\n  flex: 1; min-width: 0;\n  display: flex; flex-direction: column;\n  position: relative;\n  border-radius: 14px; overflow: hidden;\n  background: var(--bg);\n  border: 1px solid rgba(140, 165, 210, .30);\n  box-shadow:\n    0 40px 90px rgba(4, 12, 32, .55),\n    0 12px 32px rgba(4, 12, 32, .38),\n    0 0 0 1px rgba(255, 255, 255, .06);\n}\n\n/* 导出对话框 */\n.overlay {\n  position: absolute; inset: 0; z-index: 300;\n  background: rgba(10, 22, 40, .45);\n  display: none; align-items: center; justify-content: center;\n}\n.dialog {\n  width: 440px; max-width: calc(100% - 48px);\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 14px; box-shadow: var(--shadow-2);\n}\n.dialog-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-size: 14px;\n}\n.dialog-h b { font-size: 14px; }\n.dialog-h .ic { color: var(--primary); }\n.dialog-h .icon-btn { margin-left: auto; }\n.dialog-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }\n.dialog-actions .btn { min-width: 76px; }\n/* 窗口顶部品牌渐变线 */\n.window::before {\n  content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 3px;\n  background: var(--grad); z-index: 30;\n}\n\n/* 自定义标题栏 */\n.titlebar {\n  height: 42px; flex: none; position: relative; z-index: 10;\n  display: flex; align-items: center; gap: 10px; padding-left: 14px;\n  background: linear-gradient(180deg, #fcfdff, #f5f8fd);\n  border-bottom: 1px solid var(--border);\n  user-select: none;\n}\n.titlebar img { width: 34px; height: 34px; border-radius: 9px; display: block; }\n.titlebar .brand-text { line-height: 1.25; }\n.titlebar .brand-text b { display: block; font-size: 15px; letter-spacing: .2px; }\n.titlebar .brand-text small { font-size: 11px; color: var(--text-3); }\n.win-controls { margin-left: auto; align-self: stretch; display: flex; }\n\n/* 菜单栏：收纳低频命令（打开/导出/主题/更新等），保持工作区清爽 */\n.menubar {\n  height: 34px; flex: none; position: relative; z-index: 60;\n  display: flex; align-items: stretch; padding: 0 10px;\n  background: var(--surface); border-bottom: 1px solid var(--border);\n}\n.menu { position: relative; display: flex; }\n.menu-item {\n  display: flex; align-items: center; padding: 0 13px;\n  font-size: 12.5px; color: var(--text-2); cursor: default; user-select: none;\n}\n.menu:hover .menu-item { background: rgba(46, 107, 255, .08); color: var(--text-1); }\n.menu-dropdown {\n  display: none; position: absolute; top: 100%; left: 0; min-width: 236px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px; z-index: 100;\n}\n.menu:hover .menu-dropdown { display: block; }\n.menu-entry {\n  display: flex; align-items: center; gap: 8px;\n  padding: 7px 10px 7px 30px; border-radius: 8px;\n  font-size: 12.5px; color: var(--text-1); text-decoration: none;\n  cursor: pointer; position: relative; white-space: nowrap;\n}\n.menu-entry:hover { background: rgba(46, 107, 255, .08); }\n.menu-entry .check { position: absolute; left: 11px; font-size: 11px; color: var(--primary); }\n.menu-entry code { margin-left: auto; padding-left: 18px; font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }\n.menu-entry.disabled { opacity: .45; cursor: not-allowed; }\n.menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }\n.menu-entry.has-sub::after { content: \"›\"; margin-left: auto; padding-left: 16px; color: var(--text-3); }\n.submenu {\n  display: none; position: absolute; left: 100%; top: -7px; min-width: 150px;\n  background: var(--surface); border: 1px solid var(--border);\n  border-radius: 10px; box-shadow: var(--shadow-2); padding: 6px;\n}\n.menu-entry.has-sub:hover .submenu { display: block; }\n.menubar .hint { margin-left: auto; align-self: center; font-size: 11px; color: var(--text-3); }\n\n/* 舞台空态提示 */\n.stage-hint {\n  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);\n  background: rgba(255, 255, 255, .88); backdrop-filter: blur(6px);\n  border: 1px solid var(--border); border-radius: 999px;\n  padding: 6px 14px; font-size: 11.5px; color: var(--text-2); white-space: nowrap;\n}\n.stage-hint b { color: var(--primary); font-weight: 600; }\n.wc {\n  width: 46px; border: none; background: none; cursor: pointer;\n  color: var(--text-2); display: flex; align-items: center; justify-content: center;\n}\n.wc svg { width: 11px; height: 11px; display: block; }\n.wc:hover { background: #e8eef8; color: var(--text-1); }\n.wc.close:hover { background: #e81123; color: #fff; }\n\n.win-body { flex: 1; min-height: 0; overflow: auto; }\n\n.app { display: flex; height: 100%; min-height: 0; }\n\n/* 主区 */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; gap: 12px; padding: 0 20px;\n  border-bottom: 1px solid var(--border);\n  background: rgba(255, 255, 255, .78);\n  backdrop-filter: blur(10px);\n  z-index: 5;\n}\n.crumb { color: var(--text-3); font-size: 13px; }\n.crumb b { color: var(--text-1); font-size: 14.5px; font-weight: 600; margin-left: 6px; }\n.spacer { flex: 1; }\n\n.icon-btn {\n  width: 32px; height: 32px; border-radius: 9px;\n  border: 1px solid transparent; background: transparent;\n  color: var(--text-2); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.icon-btn:hover { background: #eef3fb; color: var(--text-1); }\n\n.content {\n  flex: 1; overflow: auto; padding: 20px;\n  background-image: radial-gradient(circle, rgba(46, 107, 255, .07) 1px, transparent 1.4px);\n  background-size: 22px 22px;\n}\n\n.statusbar {\n  height: 34px; flex: none;\n  display: flex; align-items: center; gap: 16px; padding: 0 20px;\n  border-top: 1px solid var(--border);\n  color: var(--text-2); font-size: 12px; background: var(--surface);\n}\n.statusbar .meta { color: var(--text-3); }\n.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }\n.dot.ok { background: var(--success); box-shadow: 0 0 0 3px rgba(18, 183, 106, .15); }\n.dot.busy { background: var(--primary); box-shadow: 0 0 0 3px rgba(46, 107, 255, .18); animation: pulse 1.2s infinite; }\n@keyframes pulse { 50% { opacity: .35; } }\n\n/* ---------------- 卡片 ---------------- */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-1);\n}\n.card-h {\n  display: flex; align-items: center; gap: 9px;\n  padding: 13px 16px; border-bottom: 1px solid var(--border);\n  font-weight: 600; font-size: 13px;\n}\n.card-h .ic { color: var(--primary); }\n.card-h .hint { margin-left: auto; font-weight: 400; color: var(--text-3); font-size: 11px; }\n.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }\n.card-b:last-child { padding-top: 0; }\n\n/* ---------------- 按钮 ---------------- */\n\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 7px;\n  height: 34px; padding: 0 14px;\n  border-radius: 10px; border: 1px solid var(--border-strong);\n  background: var(--surface); color: var(--text-1);\n  font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer;\n  transition: .15s; white-space: nowrap;\n}\n.btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 8px rgba(46, 107, 255, .12); }\n.btn.primary { background: var(--grad); border: none; color: #fff; box-shadow: var(--shadow-primary); }\n.btn.primary:hover { color: #fff; filter: brightness(1.07); }\n.btn.lg { height: 40px; font-size: 14px; border-radius: 12px; }\n.btn.block { width: 100%; }\n.btn.danger:hover { border-color: var(--danger); color: var(--danger); box-shadow: none; }\n.btn:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }\n\n/* ---------------- 表单控件 ---------------- */\n\n.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }\n.field > label { font-size: 12px; color: var(--text-2); }\n.field.disabled { opacity: .5; pointer-events: none; }\n\n.input, select.input {\n  height: 34px; border: 1px solid var(--border-strong); border-radius: 10px;\n  padding: 0 10px; font: inherit; color: var(--text-1);\n  background: var(--surface); outline: none; min-width: 0; width: 100%;\n}\n.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }\n.input.mono { font-family: var(--mono); font-size: 12px; }\n.input::placeholder { color: var(--text-3); }\n\n.ig { display: flex; align-items: stretch; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); overflow: hidden; height: 34px; }\n.ig:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }\n.ig .prefix { display: flex; align-items: center; padding: 0 4px 0 10px; color: var(--text-3); font-size: 12px; flex: none; }\n.ig input { border: none; outline: none; background: none; font: inherit; font-family: var(--mono); font-size: 12px; width: 100%; min-width: 0; padding: 0 8px 0 6px; color: var(--text-1); }\n.ig .suffix { display: flex; align-items: center; padding: 0 10px 0 4px; color: var(--text-3); font-size: 12px; flex: none; }\n\n.stepper { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 10px; height: 34px; background: var(--surface); }\n.stepper button { width: 28px; height: 100%; border: none; background: none; color: var(--text-2); cursor: pointer; font-size: 15px; font-family: inherit; }\n.stepper button:hover { color: var(--primary); }\n.stepper .val { min-width: 50px; text-align: center; font-family: var(--mono); font-size: 12.5px; }\n\n/* 分段选择 */\n.seg { display: flex; gap: 4px; background: #edf1f8; padding: 4px; border-radius: 11px; }\n.seg [data-value] {\n  flex: 1; height: 30px; border: none; background: transparent;\n  border-radius: 8px; color: var(--text-2);\n  font: inherit; font-weight: 500; cursor: pointer;\n  display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit;\n}\n.seg [data-value].on { background: #fff; color: var(--primary); box-shadow: var(--shadow-1); font-weight: 600; }\n\n/* 规格卡片 */\n.spec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }\n.spec {\n  border: 1px solid var(--border-strong); border-radius: 12px;\n  padding: 10px 4px; text-align: center; cursor: pointer;\n  background: var(--surface); position: relative; transition: .15s; font-family: inherit;\n}\n.spec b { display: block; font-size: 12.5px; margin-bottom: 3px; }\n.spec span { font-size: 10px; color: var(--text-3); font-family: var(--mono); letter-spacing: -.02em; }\n.spec:hover { border-color: var(--primary); }\n.spec.on {\n  border-color: var(--primary);\n  background: linear-gradient(135deg, rgba(46, 107, 255, .07), rgba(0, 184, 217, .06));\n  box-shadow: 0 0 0 3px var(--ring);\n}\n.spec.on::after {\n  content: \"\"; position: absolute; top: 6px; right: 6px;\n  width: 7px; height: 7px; border-radius: 50%; background: var(--grad);\n}\n\n/* 色板 */\n.swatches { display: flex; gap: 10px; align-items: center; }\n.swatch {\n  width: 30px; height: 30px; border-radius: 50%;\n  border: 1px solid rgba(15, 23, 42, .12); cursor: pointer; position: relative;\n  box-shadow: inset 0 0 0 2px #fff; padding: 0; transition: .15s;\n}\n.swatch:hover { transform: scale(1.08); }\n.swatch.on { box-shadow: inset 0 0 0 2px #fff, 0 0 0 2px #fff, 0 0 0 4px var(--primary); }\n.swatch.rainbow { background: conic-gradient(#ff5757, #ffb13d, #39d98a, #2e6bff, #8a5cf6, #ff5757); }\n\n/* 开关 */\n.switch { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; cursor: pointer; }\n.switch input { opacity: 0; width: 0; height: 0; }\n.switch i { position: absolute; inset: 0; border-radius: 999px; background: #d6deeb; transition: .18s; }\n.switch i::before {\n  content: \"\"; position: absolute; width: 16px; height: 16px; border-radius: 50%;\n  background: #fff; top: 3px; left: 3px; transition: .18s;\n  box-shadow: 0 1px 3px rgba(15, 23, 42, .25);\n}\n.switch input:checked + i { background: var(--grad); }\n.switch input:checked + i::before { transform: translateX(16px); }\n\n/* 滑杆 */\ninput[type=\"range\"] {\n  -webkit-appearance: none; appearance: none;\n  width: 100%; height: 5px; border-radius: 99px;\n  background: linear-gradient(90deg, var(--primary) var(--p, 50%), #e2e8f3 var(--p, 50%));\n  outline: none; margin: 0;\n}\ninput[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;\n  background: #fff; border: 2px solid var(--primary);\n  box-shadow: 0 1px 4px rgba(15, 23, 42, .25); cursor: pointer;\n}\n\n/* 徽标 */\n.chip {\n  display: inline-flex; align-items: center; gap: 5px;\n  height: 22px; padding: 0 9px; border-radius: 999px;\n  font-size: 11px; font-weight: 500;\n  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);\n  white-space: nowrap;\n}\n.chip.blue { background: rgba(46, 107, 255, .09); border-color: rgba(46, 107, 255, .25); color: var(--primary); }\n.chip.green { background: rgba(18, 183, 106, .10); border-color: rgba(18, 183, 106, .28); color: #0e9f5d; }\n.chip.amber { background: rgba(245, 158, 11, .12); border-color: rgba(245, 158, 11, .32); color: #c77d02; }\n.chip.grad { background: var(--grad); color: #fff; border: none; }\n.chip .dot { margin: 0; }\n\n/* 设置行 */\n.row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--border); }\n.row:last-child { border-bottom: none; }\n.row .grow { flex: 1; min-width: 0; }\n.row .t { font-weight: 500; }\n.row .d { font-size: 12px; color: var(--text-3); margin-top: 2px; }\n.row > .ctl { flex: none; display: flex; align-items: center; gap: 8px; }\n\n/* ---------------- 证件照处理页 ---------------- */\n\n.work { display: grid; grid-template-columns: 54px minmax(0, 1fr) 332px; gap: 16px; align-items: start; }\n\n.rail { padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center; }\n.rail-btn {\n  width: 38px; height: 38px; border-radius: 10px; border: none; background: none;\n  color: var(--text-2); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.rail-btn:hover { background: #eef3fb; color: var(--primary); }\n.rail-btn.on { background: rgba(46, 107, 255, .10); color: var(--primary); }\n.rail hr { width: 24px; border: none; border-top: 1px solid var(--border); margin: 4px 0; }\n\n.stage-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }\n.stage-toolbar { display: flex; align-items: center; gap: 8px; }\n.zoom { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); height: 32px; overflow: hidden; }\n.zoom button { width: 30px; height: 100%; border: none; background: none; color: var(--text-2); cursor: pointer; font-size: 15px; font-family: inherit; }\n.zoom button:hover { color: var(--primary); background: #f1f5fc; }\n.zoom .pct { min-width: 46px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--text-1); }\n.tool {\n  height: 32px; padding: 0 11px; border-radius: 9px;\n  border: 1px solid var(--border-strong); background: var(--surface);\n  display: inline-flex; gap: 6px; align-items: center;\n  color: var(--text-2); cursor: pointer; font-size: 12px; font-family: inherit;\n}\n.tool .ic { width: 15px; height: 15px; }\n.tool:hover { color: var(--primary); border-color: var(--primary); }\n.tool.on { border-color: rgba(46, 107, 255, .45); color: var(--primary); background: rgba(46, 107, 255, .06); }\n\n.stage {\n  position: relative; border-radius: var(--r-lg);\n  border: 1px solid var(--border);\n  background-color: #fbfcfe;\n  background-image:\n    linear-gradient(45deg, #eef2f8 25%, transparent 25%, transparent 75%, #eef2f8 75%),\n    linear-gradient(45deg, #eef2f8 25%, transparent 25%, transparent 75%, #eef2f8 75%);\n  background-size: 18px 18px;\n  background-position: 0 0, 9px 9px;\n  min-height: 600px;\n  display: flex; align-items: center; justify-content: center;\n  overflow: hidden;\n  box-shadow: var(--shadow-1);\n}\n\n.photo {\n  position: relative; width: 300px; height: 400px; border-radius: 6px;\n  box-shadow: 0 10px 34px rgba(10, 31, 64, .22);\n  transition: background .25s;\n}\n.photo > svg.person { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }\n.photo.compare { filter: saturate(.9); }\n\n.guides { position: absolute; inset: 0; pointer-events: none; transition: opacity .15s; }\n.guides.hidden { opacity: 0; }\n\n/* 取景角框 */\n.corner { position: absolute; width: 22px; height: 22px; border: 2.5px solid #35e0ff; filter: drop-shadow(0 0 6px rgba(53, 224, 255, .65)); }\n.corner.tl { top: -8px; left: -8px; border-right: none; border-bottom: none; border-radius: 5px 0 0 0; }\n.corner.tr { top: -8px; right: -8px; border-left: none; border-bottom: none; border-radius: 0 5px 0 0; }\n.corner.bl { bottom: -8px; left: -8px; border-right: none; border-top: none; border-radius: 0 0 0 5px; }\n.corner.br { bottom: -8px; right: -8px; border-left: none; border-top: none; border-radius: 0 0 5px 0; }\n\n/* 扫描动效 */\n.scanline {\n  position: absolute; left: 0; right: 0; top: -70px; height: 64px;\n  background: linear-gradient(180deg, transparent, rgba(53, 224, 255, .30), transparent);\n  mix-blend-mode: screen; pointer-events: none;\n  animation: scan 3.4s ease-in-out infinite;\n}\n@keyframes scan { 0% { top: -70px; } 55% { top: 100%; } 100% { top: 100%; } }\n\n.dim-chip {\n  position: absolute; right: 10px; bottom: 10px;\n  background: rgba(10, 22, 40, .72); backdrop-filter: blur(6px);\n  color: #dff4ff; font-family: var(--mono); font-size: 11px;\n  padding: 4px 9px; border-radius: 8px;\n  border: 1px solid rgba(120, 200, 255, .35);\n}\n\n.src { display: flex; gap: 12px; align-items: center; }\n.src .thumb { width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--border); flex: none; overflow: hidden; }\n.src .thumb svg { width: 100%; height: 100%; display: block; }\n.src .meta { flex: 1; min-width: 0; }\n.src b { font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.src span { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }\n\n.calc {\n  display: flex; align-items: center; gap: 8px;\n  background: var(--surface-2); border: 1px dashed var(--border-strong);\n  border-radius: 10px; padding: 8px 12px;\n  color: var(--text-2); font-size: 12px;\n}\n.calc b { font-family: var(--mono); color: var(--primary); font-weight: 600; }\n\n.chips-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }\n.chips-row .lbl { font-size: 11.5px; color: var(--text-3); margin-right: 2px; }\n.chip.locked { opacity: .6; }\n\n.actions { display: flex; flex-direction: column; gap: 10px; }\n.actions-row { display: flex; gap: 10px; }\n.actions-row .btn { flex: 1; }\n\n/* ---------------- 批量处理页 ---------------- */\n\n.batch { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }\n\n.dropzone {\n  border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg);\n  background: rgba(255, 255, 255, .65);\n  padding: 22px; cursor: pointer; transition: .15s; text-align: center;\n  display: flex; align-items: center; gap: 16px; justify-content: center;\n}\n.dropzone:hover { border-color: var(--primary); background: rgba(46, 107, 255, .04); }\n.dropzone .big-ic {\n  width: 46px; height: 46px; border-radius: 14px; flex: none;\n  background: linear-gradient(135deg, rgba(46, 107, 255, .12), rgba(0, 184, 217, .12));\n  display: flex; align-items: center; justify-content: center; color: var(--primary);\n}\n.dropzone .big-ic .ic { width: 22px; height: 22px; }\n.dropzone .dt { text-align: left; }\n.dropzone b { font-size: 13.5px; display: block; }\n.dropzone span { font-size: 12px; color: var(--text-3); }\n\n.table { width: 100%; border-collapse: collapse; }\n.table th {\n  font-size: 11px; color: var(--text-3); text-align: left; font-weight: 500;\n  padding: 10px 12px; border-bottom: 1px solid var(--border); letter-spacing: .05em;\n}\n.table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }\n.table tr:last-child td { border-bottom: none; }\n.table tbody tr:hover td { background: #f8fafd; }\n.file-cell { display: flex; gap: 10px; align-items: center; }\n.file-cell .thumb { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; flex: none; }\n.file-cell .thumb svg { width: 100%; height: 100%; display: block; }\n.file-cell b { display: block; font-size: 12.5px; font-weight: 600; }\n.file-cell small { color: var(--text-3); font-size: 11px; font-family: var(--mono); }\n\n.progress { width: 110px; height: 6px; border-radius: 99px; background: #e8edf6; overflow: hidden; }\n.progress i { display: block; height: 100%; border-radius: 99px; background: var(--grad); animation: fill 2.6s ease-in-out infinite alternate; }\n@keyframes fill { from { width: 22%; } to { width: 86%; } }\n\n.batch-bar { display: flex; align-items: center; gap: 8px; padding: 11px 16px; border-top: 1px s) {\n    container.querySelectorAll(selector).forEach(function (el) {\n      el.classList.toggle(cls, el === container.__active);\n    });\n  }\n\n  document.addEventListener('click', function (e) {\n    // 分段选择\n    var segOpt = e.target.closest('.seg [data-value]');\n    if (segOpt && !segOpt.disabled) {\n      var seg = segOpt.closest('.seg');\n      seg.querySelectorAll('[data-value]').forEach(function (b) {\n        b.classList.toggle('on', b === segOpt);\n      });\n      seg.dispatchEvent(new CustomEvent('segchange', { bubbles: true, detail: { value: segOpt.dataset.value } }));\n    }\n\n    // 色板\n    var sw = e.target.closest('.swatch');\n    if (sw) {\n      var group = sw.closest('.swatches');\n      group.querySelectorAll('.swatch').forEach(function (s) { s.classList.toggle('on', s === sw); });\n      group.dispatchEvent(new CustomEvent('swchange', { bubbles: true, detail: { color: sw.dataset.color || null } }));\n    }\n\n    // 规格卡片\n    var spec = e.target.closest('.spec');\n    if (spec && !spec.disabled) {\n      var grid = spec.closest('.spec-grid');\n      grid.querySelectorAll('.spec').forEach(function (s) { s.classList.toggle('on', s === spec); });\n      document.dispatchEvent(new CustomEvent('specchange', { detail: { id: spec.dataset.spec } }));\n    }\n  });\n\n  // 滑杆轨道着色\n  function paintRange(r) {\n    var min = Number(r.min) || 0, max = Number(r.max) || 100;\n    var p = ((Number(r.value) - min) / (max - min)) * 100;\n    r.style.setProperty('--p', p + '%');\n  }\n  document.querySelectorAll('input[type=\"range\"]').forEach(function (r) {\n    paintRange(r);\n    r.addEventListener('input', function () { paintRange(r); });\n  });\n})();\n<\/script>\n<script>// 根据应用 JSON 生成；运行 scripts/sync_localization_keys.ps1 更新。\nwindow.IEDITOR_RESOURCES = {\"zh-CN\":{\"language\":\"简体中文\",\"description\":\"IEditor 简体中文资源\",\"cultureName\":\"zh-CN\",\"Localization\":{\"Common\":{\"Filenames\":{\"Default\":\"证件照\",\"Photo\":\"照片\",\"Unnamed\":\"未命名\",\"
