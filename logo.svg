<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="ie-title">
  <title id="ie-title">IEditor</title>
  <defs>
    <linearGradient id="ie-bg" x1="40" y1="16" x2="472" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
    <linearGradient id="ie-fg" x1="272" y1="118" x2="272" y2="394" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E6BFF"/>
      <stop offset="1" stop-color="#00B8D9"/>
    </linearGradient>
    <radialGradient id="ie-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 110) scale(310)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ie-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A2A66" flood-opacity="0.32"/>
    </filter>
    <clipPath id="ie-card">
      <rect x="172" y="118" width="200" height="276" rx="22"/>
    </clipPath>
  </defs>

  <!-- 渐变徽章底 -->
  <rect width="512" height="512" rx="116" fill="url(#ie-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#ie-glow)"/>

  <!-- 字母 I -->
  <rect x="118" y="140" width="34" height="232" rx="17" fill="#FFFFFF"/>

  <!-- 证件照卡片 -->
  <g filter="url(#ie-shadow)">
    <rect x="172" y="118" width="200" height="276" rx="22" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#ie-card)">
    <circle cx="272" cy="210" r="40" fill="url(#ie-fg)"/>
    <rect x="200" y="282" width="144" height="180" rx="66" fill="url(#ie-fg)"/>
  </g>

  <!-- 裁切对焦角框 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round">
    <path d="M154 141 L154 121 Q154 100 175 100 L195 100"/>
    <path d="M349 100 L369 100 Q390 100 390 121 L390 141"/>
    <path d="M154 371 L154 391 Q154 412 175 412 L195 412"/>
    <path d="M349 412 L369 412 Q390 412 390 391 L390 371"/>
  </g>

  <!-- 科技星光 -->
  <path d="M398 50 C400.5 63 407 69.5 420 72 C407 74.5 400.5 81 398 94 C395.5 81 389 74.5 376 72 C389 69.5 395.5 63 398 50 Z" fill="#8FE9FF"/>
</svg>
